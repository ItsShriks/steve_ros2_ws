# Real robot: stand-alone controller manager for the gripper (node gripper_controller_manager),
# separate from the UR driver's /controller_manager. Controller names are chosen so that the
# gripper action is /gripper_controller/gripper_cmd exactly as in Gazebo.
gripper_controller_manager:
  ros__parameters:
    update_rate: 100
    gripper_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    gripper_controller:
      type: position_controllers/GripperActionController
    robotiq_activation_controller:   # only used with gripper_hw:=robotiq_driver
      type: robotiq_controllers/RobotiqActivationController

gripper_joint_state_broadcaster:
  ros__parameters:
    joints: [robotiq_85_left_knuckle_joint]

gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint   # 0.0 open ... 0.7929 closed
    goal_tolerance: 0.01
    allow_stalling: true
    stall_timeout: 1.0
    stall_velocity_threshold: 0.001

robotiq_activation_controller:
  ros__parameters:
    default: true
