# MoveIt time-parameterisation limits (UR5e datasheet: 180 deg/s on all joints).
# Plans are additionally scaled by the defaults below — raise them carefully on the real robot.
default_velocity_scaling_factor: 0.2
default_acceleration_scaling_factor: 0.2

joint_limits:
  ur5eshoulder_pan_joint:  {has_velocity_limits: true, max_velocity: 3.14, has_acceleration_limits: true, max_acceleration: 5.0}
  ur5eshoulder_lift_joint: {has_velocity_limits: true, max_velocity: 3.14, has_acceleration_limits: true, max_acceleration: 5.0}
  ur5eelbow_joint:         {has_velocity_limits: true, max_velocity: 3.14, has_acceleration_limits: true, max_acceleration: 5.0}
  ur5ewrist_1_joint:       {has_velocity_limits: true, max_velocity: 3.14, has_acceleration_limits: true, max_acceleration: 5.0}
  ur5ewrist_2_joint:       {has_velocity_limits: true, max_velocity: 3.14, has_acceleration_limits: true, max_acceleration: 5.0}
  ur5ewrist_3_joint:       {has_velocity_limits: true, max_velocity: 3.14, has_acceleration_limits: true, max_acceleration: 5.0}
  robotiq_85_left_knuckle_joint: {has_velocity_limits: true, max_velocity: 0.5, has_acceleration_limits: true, max_acceleration: 1.0}
